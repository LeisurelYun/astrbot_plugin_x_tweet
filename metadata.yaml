name: astrbot_plugin_x_tweet
display_name: X/Twitter 推文解析
short_desc: 自动解析 X/Twitter 链接与个人主页，支持 X 风格卡片渲染、图片视频、翻译、楼中楼引用块与合并转发、黑名单、可配置解析源顺序与带语法的搜索
desc: 自动识别群内与私聊的 X / Twitter 链接，解析正文、作者与图片视频并发送，可给原消息贴表情回应、
  按需选择图片尺寸（含原图），自动翻译推文；
  引用 / 回复的主贴会单独发一条消息并完整解析，楼中楼默认逐层用「引用回复气泡」发送并补一条合并转发汇总
  （可在配置里改成只发气泡或只发合并转发，后端不支持时自动回退合并转发；只发合并转发时节点内自带
  文字引用块）；推文还可选择渲染成 X 风格卡片，
  卡片不内嵌媒体——图片按顺序进一条合并转发、视频单独发送；
  支持解析个人主页（可渲染成 X 风格主页卡片：横幅 / 大头像 / 简介 / 关注数 / 最近推文，
  也可配置为纯文字资料卡）、按作者或关键词跳过解析（命中黑名单的楼层改用占位说明并继续向上追溯）；
  搜索支持在配置的账号列表里检索，账号列表为空时按关键词自动匹配相关账号并发过滤后的其近期推文，
  指令支持 from:账号 / -排除词 / min_faves:N 语法（/xt 搜索 无参或 /xt help 查看语法参考图）；
  搜索结果默认做成一条合并转发（每条一个节点），也可配置为图片卡片或纯文本，并可开启补译文；
  解析采用可配置源顺序（默认 FxTwitter v2/v1 → 镜像实例轮询 → Syndication CDN → oEmbed 纯文本兜底，可在 parse_source_order 调整）；
  镜像同时兼容 FxTwitter 同构与 vx 系（vxtwitter 等）响应格式；
  同时注册 LLM 工具，可让 AI 总结、翻译推文或检索 X 上的最新内容。无需 X 官方 API。
help: |
  【自动解析】群内或私聊直接发送 x.com / twitter.com 的 /status/ 链接，机器人自动解析并发送正文、图片、视频。
  【引用 / 回复】主贴会单独发一条消息（含标签「引用的主贴」「被回复的主贴」），末尾保留主贴链接便于再次解析。
  【楼中楼】默认逐层用「引用回复气泡」发送（第 1 层引用你那条消息，之后每层引用上一层），再补一条合并转发
  汇总整条楼；发送方式可在配置里选「合并转发 + 逐层气泡 / 只发逐层气泡 / 只发合并转发」，后端不支持 reply 段时
  自动退回「一级主贴 → 二级回复 → … → 本条链接」的合并转发；只发合并转发时每个节点自带「↩ 回复 @上一层」文字引用块。
  【个人主页】发送 https://x.com/<账号> 即可看资料卡与最近推文。
  【贴表情】解析成功后会给你的消息贴一个表情回应（默认 👍，可在配置中修改或关闭）。
  【图片尺寸】可在配置中选择 orig（原图）/ large / medium / small。
  【自动翻译】默认把推文翻译成简体中文（支持 25 种语言），正文展示方式可选「原文 + 译文 / 只发原文 / 只发译文」；
  FxTwitter 自带译文缺失时会按配置先重试几次，仍拿不到才回退大模型，短文本不再浪费模型额度。
  【黑名单】可在配置里按作者或关键词跳过不想解析的推文；楼中楼里命中的那一层换成占位说明后继续向上追溯。
  【AI 总结】发送链接后对机器人说「总结这条推文」「翻译一下」即可，AI 会自动调用 parse_x_tweet 工具；
  说「X 上最近有什么关于 XX 的消息」会调用 search_x_posts 工具。
  【指令】
    /xt 状态          —— 查看插件运行状态、翻译与缓存统计
    /xt 翻译 <语言>   —— 只切换本会话的翻译目标语言（发「/xt 翻译 默认」恢复，如 /xt 翻译 ja）
    /xt 主页 <账号>   —— 解析某个 X 账号的资料卡
    /xt 搜索 <关键词> —— 按关键词检索最新推文；支持 from:账号 / -排除词 / min_faves:N 语法
    /xt 帮助 / /xt 搜索（无参） —— 查看搜索语法说明图片
    /xt 清理          —— 清理本地缓存文件（仅管理员）
version: v1.13.1
author: Leisurelyun
